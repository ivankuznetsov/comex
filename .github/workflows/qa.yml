name: QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run unit and API tests
        run: bun run test
      - name: Check demo gateway security
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_demo_proxy.py
      - name: Build and typecheck
        run: |
          bun run build
          bun run typecheck
      - name: Install Chromium and system dependencies
        run: bun x playwright install --with-deps chromium
      - name: Run browser tests with simulated providers
        run: |
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          ./e2e/run-full-flow.sh
